<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KshetraAI — Sovereign Industrial AI Execution Platform. Confidential Data → Verified Work. Intelligence Within Your Boundary." />
    <title>KshetraAI — Sovereign Industrial AI Platform</title>
    <!-- GitHub Pages SPA routing fix: restore URL from ?p= param set by 404.html -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle ?p= query param from 404.html redirect
        var search = window.location.search;
        if (search.slice(1,3) === 'p=') {
          var decoded = search.slice(3).replace(/~and~/g, '&');
          window.history.replaceState(null, null,
            window.location.pathname + decoded + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
